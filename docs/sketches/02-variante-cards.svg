<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Caveat, 'Brush Script MT', cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence baseFrequency="0.02" numOctaves="2" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#fefcf3"/>
  <g stroke="#dde5d0" stroke-width="0.8">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="510" x2="800" y2="510"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
  </g>
  <line x1="80" y1="0" x2="80" y2="600" stroke="#f5b3b3" stroke-width="1"/>

  <text x="100" y="50" font-size="28" fill="#1e3a5f" font-weight="bold">Variante B — Projekt-Cards (Trello / Asana Stil)</text>

  <!-- App-Frame -->
  <g stroke="#2b3a5e" stroke-width="2.5" fill="none" filter="url(#rough2)">
    <rect x="100" y="80" width="600" height="430" rx="8"/>
    <line x1="200" y1="80" x2="200" y2="510"/>
  </g>

  <!-- Sidebar -->
  <g font-size="14" fill="#2b3a5e">
    <text x="118" y="120">Max Muster</text>
    <text x="118" y="140" font-size="11" fill="#666">Bauunternehmung</text>
    <text x="118" y="180">› Projekte</text>
    <text x="118" y="210">○ Kalender</text>
    <text x="118" y="240">○ Stats</text>
    <text x="118" y="270">○ Konto</text>
  </g>

  <!-- Cards (3x2 Grid) -->
  <g stroke="#2b3a5e" stroke-width="2" fill="none" filter="url(#rough2)">
    <rect x="220" y="100" width="140" height="100" rx="6"/>
    <rect x="380" y="100" width="140" height="100" rx="6"/>
    <rect x="540" y="100" width="140" height="100" rx="6"/>
    <rect x="220" y="220" width="140" height="100" rx="6"/>
    <rect x="380" y="220" width="140" height="100" rx="6"/>
    <rect x="540" y="220" width="140" height="100" rx="6"/>
    <rect x="220" y="340" width="140" height="100" rx="6"/>
    <rect x="380" y="340" width="140" height="100" rx="6"/>
  </g>

  <!-- Card-Inhalte -->
  <g font-size="11" fill="#2b3a5e">
    <text x="230" y="120" font-weight="bold">Steinegg</text>
    <text x="230" y="140">Schlieren</text>
    <text x="230" y="160">[laufend]</text>
    <text x="230" y="180">ÖFFNEN →</text>

    <text x="390" y="120" font-weight="bold">Müller AG</text>
    <text x="390" y="140">Winterthur</text>
    <text x="390" y="160">[laufend]</text>
    <text x="390" y="180">ÖFFNEN →</text>

    <text x="550" y="120" font-weight="bold">Sägebach</text>
    <text x="550" y="140">Horgen</text>
    <text x="550" y="160">[laufend]</text>
    <text x="550" y="180">ÖFFNEN →</text>

    <text x="230" y="240" font-weight="bold">Brunner EFH</text>
    <text x="230" y="260">Jona</text>
    <text x="230" y="280">[laufend]</text>

    <text x="390" y="240" font-weight="bold">Hardturm</text>
    <text x="390" y="260">Zürich</text>
    <text x="390" y="280">[offen]</text>

    <text x="550" y="240" font-weight="bold">Coop Halle</text>
    <text x="550" y="260">Wallisellen</text>
    <text x="550" y="280">[abgeschl.]</text>
  </g>

  <!-- Annotation -->
  <g font-size="18" fill="#16834a" font-weight="bold">
    <text x="100" y="545">✓ GEWÄHLT! Pro:</text>
  </g>
  <g font-size="15" fill="#2b3a5e">
    <text x="100" y="570">+ Card-Metapher = mentales Modell für Projekte</text>
    <text x="100" y="590">+ Drill-Down via Click, passt zu Nielsen #6</text>
    <text x="450" y="570">+ Status-Badge sofort sichtbar</text>
    <text x="450" y="590">+ Mockup Figma-konsistent</text>
  </g>
</svg>
