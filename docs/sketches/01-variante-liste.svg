<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Caveat, 'Brush Script MT', cursive">
  <defs>
    <filter id="rough">
      <feTurbulence baseFrequency="0.02" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <pattern id="paper" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#fefcf3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#paper)"/>
  <!-- horizontal lines (lined paper) -->
  <g stroke="#dde5d0" stroke-width="0.8">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="510" x2="800" y2="510"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
  </g>
  <line x1="80" y1="0" x2="80" y2="600" stroke="#f5b3b3" stroke-width="1"/>

  <text x="100" y="50" font-size="28" fill="#1e3a5f" font-weight="bold">Variante A — Listen-orientiert (wie Capmo)</text>

  <!-- App-Frame skizziert -->
  <g stroke="#2b3a5e" stroke-width="2.5" fill="none" filter="url(#rough)">
    <rect x="100" y="80" width="600" height="430" rx="8"/>
    <!-- Sidebar -->
    <line x1="200" y1="80" x2="200" y2="510"/>
    <!-- Header -->
    <line x1="200" y1="130" x2="700" y2="130"/>
  </g>

  <!-- Sidebar-Items -->
  <g font-size="14" fill="#2b3a5e">
    <text x="118" y="120">≡ Projekte</text>
    <text x="118" y="155">○ Lieferungen</text>
    <text x="118" y="190">○ Reports</text>
    <text x="118" y="225">○ Settings</text>
  </g>

  <!-- Liste -->
  <g stroke="#2b3a5e" stroke-width="1.5" fill="none" filter="url(#rough)">
    <line x1="220" y1="170" x2="680" y2="170"/>
    <line x1="220" y1="210" x2="680" y2="210"/>
    <line x1="220" y1="250" x2="680" y2="250"/>
    <line x1="220" y1="290" x2="680" y2="290"/>
    <line x1="220" y1="330" x2="680" y2="330"/>
    <line x1="220" y1="370" x2="680" y2="370"/>
    <line x1="220" y1="410" x2="680" y2="410"/>
    <line x1="220" y1="450" x2="680" y2="450"/>
  </g>

  <!-- Spaltentitel + Zeilen -->
  <g font-size="13" fill="#2b3a5e">
    <text x="230" y="160">Projekt</text>
    <text x="350" y="160">Status</text>
    <text x="450" y="160">Adresse</text>
    <text x="600" y="160">Dauer</text>
    <text x="230" y="195">Steinegg WHG</text>
    <text x="350" y="195">laufend</text>
    <text x="450" y="195">Schlieren</text>
    <text x="600" y="195">01.26-08.27</text>
    <text x="230" y="235">Halle Müller AG</text>
    <text x="350" y="235">laufend</text>
    <text x="450" y="235">Winterthur</text>
    <text x="600" y="235">03.26-12.26</text>
    <text x="230" y="275">EFH Brunner</text>
    <text x="350" y="275">laufend</text>
    <text x="450" y="275">Jona</text>
    <text x="600" y="275">02.26-11.26</text>
    <text x="230" y="315">...</text>
  </g>

  <!-- Annotation Pro / Contra -->
  <g font-size="18" fill="#c5302b" font-weight="bold">
    <text x="100" y="545">❌ Contra:</text>
  </g>
  <g font-size="15" fill="#2b3a5e">
    <text x="100" y="570">— Dichte hoch, aber wenig visuell — sieht aus wie Excel</text>
    <text x="100" y="590">— „Card-Gefühl" aus den Mockups geht verloren</text>
  </g>

  <g font-size="18" fill="#16834a" font-weight="bold">
    <text x="450" y="545">✓ Pro:</text>
  </g>
  <g font-size="15" fill="#2b3a5e">
    <text x="450" y="570">+ Viele Projekte gleichzeitig sichtbar</text>
    <text x="450" y="590">+ Sortier-/Filter-Spalten klassisch</text>
  </g>
</svg>
